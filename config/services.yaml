# This file is the entry point to configure your own services.
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    sdwa5_dsp.demo_config: '%kernel.project_dir%/resources/demo_config.bin'
    # Read after a factory reset, the editor marks every setting that differs from it
    sdwa5_dsp.factory_config: '%kernel.project_dir%/resources/factory_config.bin'
    sdwa5_dsp.timeout: 1.0
    sdwa5_dsp.bridge_socket_default: '%kernel.project_dir%/var/bridge.sock'
    sdwa5_dsp.bridge_socket: '%env(default:sdwa5_dsp.bridge_socket_default:legacy:SDWA5_DSP_BRIDGE_SOCKET)%'
    # Longest lifetime of one /api/events stream in seconds, the browser reconnects after it
    sdwa5_dsp.events_lifetime: 300
    # Backups, recordings and the session of the auto EQ
    sdwa5_dsp.autoeq_dir: '%kernel.project_dir%/var/autoeq'
    # Recordings and results of sdwa5-dsp:measure
    sdwa5_dsp.measure_dir: '%kernel.project_dir%/var/measure'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Model/'
            - '../src/Protocol/'
            - '../src/Client/'
            - '../src/Discovery/Subnet.php'
            - '../src/Transport/{DemoTransport,HidrawTransport,TcpTransport,TransportException}.php'
            - '../src/Bridge/{Bridge,BridgeException,CommandMap,WriteQueue}.php'

    App\Transport\HidrawLocator:
        arguments:
            $sysfsRoot: '%env(legacy:SDWA5_DSP_HIDRAW_SYSFS)%'
            $devRoot: '%env(legacy:SDWA5_DSP_HIDRAW_DEV)%'

    App\Transport\TransportFactory:
        arguments:
            $demoConfigPath: '%sdwa5_dsp.demo_config%'
            # The demo restores it on a recall of F00
            $factoryConfigPath: '%sdwa5_dsp.factory_config%'
            $timeout: '%sdwa5_dsp.timeout%'

    App\Discovery\Discovery:
        arguments:
            $networks: '%env(legacy:SDWA5_DSP_DISCOVERY_NETWORKS)%'

    App\Bridge\BridgeClient:
        arguments:
            $socketPath: '%sdwa5_dsp.bridge_socket%'

when@test:
    parameters:
        sdwa5_dsp.events_lifetime: 1
        sdwa5_dsp.autoeq_dir: '%kernel.project_dir%/var/autoeq-test'
        sdwa5_dsp.measure_dir: '%kernel.project_dir%/var/measure-test'
    services:
        # The default logger writes expected errors (404, 405) of the web tests to stderr
        logger:
            class: Psr\Log\NullLogger
        # arecord and a sound card are missing in CI, the fake writes a synthetic recording
        App\Measurement\RecorderFactory:
            class: App\Tests\Support\FakeRecorderFactory
