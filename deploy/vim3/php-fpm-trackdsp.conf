; trackdsp browser editor. Every open editor tab holds one worker for its event stream (up to 300 s).
[trackdsp]
user = trackdsp
group = trackdsp
listen = /run/php/trackdsp.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
php_admin_value[memory_limit] = 128M
php_admin_value[output_buffering] = 0
