    # Tooltips. A widget looks its own up by its state path without side and index, e.g. comp.ratio
    tip:
        name: "Names stored on the device and saved with presets. Use up to 8 characters. Editing a name writes it to the connected device without renaming linked members."
        eq_labels: "Show labels for every PEQ band and the high-pass and low-pass filters. This changes plot labels only; filter settings and bypass remain unchanged."
        display:
            theme: "Automatic follows the system colour theme. Light and Dark override it for this browser."
            language: "Automatic uses the server/browser language. English or German stores a language cookie and reloads the editor."
            visibility: "Show this channel in navigation, processing pages, Matrix, routing graph and the Gain EQ overview. Hidden channels remain active and still receive linked edits."
            grouped: "Show one control per linked processing group and one mixed-state group control for visibility, overview selection and channel EQ preferences. Matrix, routing and membership selectors retain individual channels. Hidden members remain included in group edits."
            show_inputs: "Show all eight inputs. Output visibility and Aux visibility remain unchanged."
            show_outputs: "Show all eight outputs. Input visibility and Aux visibility remain unchanged."
            show_all: "Show all inputs, outputs and Aux. Keep the current link-group control preference."
            link_code: "Show each link group code or its browser name. Link assignments remain unchanged."
            link_shape: "Show the distinct icon for each link group throughout the interface."
            link_colour: "Show link-group colours on channel marks, group headings and browser group-name fields."
            placement_normal: "Keep channels in their original numerical order."
            placement_side: "Place linked channel members next to each other while retaining individual channel controls."
            placement_stacked: "Gather linked members under one group heading with its name, icon and colour. Tall processing strips remain side by side."
            link_matrix_lower: "Show each channel pair of the Link dialog once, below the diagonal, with the column headers under the matrix. A lit cell takes the later channel of its pair out of its group."
            link_matrix_upper: "Show each channel pair of the Link dialog once, above the diagonal, with the row headers on the right. A lit cell takes the later channel of its pair out of its group."
            link_matrix_full: "Show the full Link dialog matrix with both halves. A lit cell takes its column channel out of its group."
            group_names: "Give each link group a browser-only name of up to 12 characters. Leave it empty to use the group code. Device channel names and link assignments remain unchanged."
            overview_channel: "Include this channel curve in the Gain EQ overview. Its selection is kept while the channel is hidden globally and returns when the channel is shown again."
            channel_eq: "Set magnitude, phase and filter-label visibility independently for every channel plot, including globally hidden channels."
            matrix_outputs: "Use outputs and Aux as matrix rows, with inputs and Aux as columns. Routing connections remain unchanged."
            matrix_inputs: "Use inputs and Aux as matrix rows, with outputs and Aux as columns. Routing connections remain unchanged."
        gain: "Level of the channel in dB. 0 dB leaves the signal unchanged, the lowest step mutes it."
        mute: "Mutes the channel. The gain keeps its value."
        phase: "Polarity. Inverse turns the signal upside down, for a speaker or microphone wired the other way round."
        mode: "Input sensitivity. Line for line level sources, Mic for microphones. +48V needs a Mic mode."
        phantom: "+48V phantom power for condenser microphones. It needs a Mic mode."
        delay: "Delays the output, for example to line up speakers at different distances. In the unit chosen above, ms, m or ft."
        delay_unit: "The unit the delay fields show. The device keeps the delay in samples, so switching changes no delay."
        gate:
            threshold: "Below this level the gate closes and silences the input, in dB on the meter scale."
            attack: "How fast the gate opens once the level rises above the threshold, in ms."
            release: "How fast the gate closes once the level falls below the threshold, in ms."
        comp:
            threshold: "Above this level the compressor lowers the gain, in dB on the meter scale."
            ratio: "How strongly a level above the threshold is reduced. At 1:2.0, 2 dB above the threshold come out as 1 dB. Limit holds the level at the threshold."
            attack: "How fast the compressor reacts once the level rises above the threshold, in ms."
            release: "How fast the compressor lets go once the level falls below the threshold, in ms."
        sub:
            gain: "Level of this Sub Control in percent. It moves every channel it selects."
            mute: "Mutes every channel this Sub Control selects."
            mask: "Selects the channels this Sub Control moves."
        groups:
            gain: "Level of this group in percent. It moves every channel the group selects."
            mute: "Mutes every channel this group selects."
            mask: "Selects the channels this group moves."
        select: "Selects the inputs that feed the Aux."
        automix:
            on: "Switches AutoMix on or off."
            threshold: "Level from which AutoMix counts an input as active, in dB."
            attack: "How fast AutoMix opens an input that becomes active, in ms."
            release: "How fast AutoMix lowers an input that falls silent, in ms."
            select: "Selects the inputs AutoMix works on."
        automix_slope: "How far AutoMix lowers the inputs as more of them become active, in dB."
        camera:
            on: "Switches the Camera function on or off."
        effect:
            on: "Switches the Aux effect on or off."
            echo: "Level of the echo, 0 to 100."
            echo_repeat: "How much of the echo repeats, 0 to 100."
            echo_delay: "Time between the echoes, in ms."
            echo_predelay: "Time before the first echo, in ms."
            reverb: "Level of the reverb, 0 to 100."
            reflect: "Strength of the reflections in the reverb, 0 to 100."
            time: "Length of the reverb, in s."
            rev_predelay: "Time before the reverb sets in, in ms."
            gain: "Level of the whole effect, 0 to 100."
        tone_mode: "Source of the test tone: the analog inputs, pink or white noise, or a sine."
        tone_freq: "Frequency of the sine, in Hz."
        device_id: "The ID of the device for RS232/485 control, 1 to 254."
        demo: "Connects to the simulated device, to try the editor without an 8x8. Nothing reaches a device."
        bar:
            online: "Shows whether the editor reaches the device. Demo means the simulated device. A click opens the connection, to choose the device or disconnect."
        foot:
            number: "The preset the device last recalled or stored, U01 to U20 or F00 for the factory default. It shows – until the device reports one."
            name: "The name of the live settings, from the preset last recalled or stored. Store suggests it for the slot."
        eq_bypass: "Switches off the EQ of this channel. The bands keep their values."
        eq_reset: "Sets every band of this channel back to 0 dB at its default frequency."
        eq_mag: "Shows the magnitude in dB on the left axis."
        eq_phase: "Shows the phase in degrees, on the right axis while the magnitude shows too."
        eq_separate: "Show Input, Output and Aux EQ curves in separate plots. Curve selections and magnitude/phase settings stay unchanged."
        band:
            freq: "Centre frequency of the band, in Hz."
            q: "Q is the width of the band. A higher Q acts on a narrower range."
            gain: "Boost or cut of the band, in dB."
            type: "Filter shape of the band: peak, shelf, low or high pass, or allpass."
            bypass: "Switches the band off without losing its values."
        hpf_freq: "Frequency of the high-pass filter, in Hz. Everything below it is cut."
        lpf_freq: "Frequency of the low-pass filter, in Hz. Everything above it is cut."
        slope: "How steeply the filter cuts, in dB per octave. BW is Butterworth, BL Bessel and LK Linkwitz-Riley."
        panel:
            preset_file: "Inspect a saved preset without changing live settings. Apply sends it only after confirmation."
            peq: "Parametric EQ (PEQ). Every band raises or lowers the range around its frequency."
            selected_band: "Frequency, Q and gain of the band selected in the table or on the curve."
            hpf: "High-pass filter (HPF). It removes everything below its frequency."
            lpf: "Low-pass filter (LPF). It removes everything above its frequency."
            fbq: "Feedback suppression (FBQ). It finds feedback and notches it out. Close switches it off, level 1 to 4 set how strongly it acts."
            aux_comp: "Compressor of the Aux. Set opens all of its values."
            aux_comp_dialog: "Threshold, ratio, attack and release of the Aux compressor."
            automix: "AutoMix lowers the selected inputs that are not in use, so only the active microphones stay open."
            effect: "Echo and reverb on the Aux."
            camera: "Camera function of the vendor editor, set like AutoMix. What the device does with it is not documented yet."
            aux_select: "Inputs feeding Aux and outputs receiving Aux."
            sub: "Sub Control. One fader and one mute for a selection of inputs and one for a selection of outputs, in percent. Between them the Aux, with its gain, mute, inputs feeding it and outputs receiving it."
            groups: "Group Control. Eight groups, each with one fader and one mute for the channels it selects, in percent."
            gate_curve: "The curve of the gate of the input last touched below, its input level against its output level in dB. The red dot is the threshold, below it the gate closes."
            comp_curve: "The curve of the compressor of the output or Aux last touched below, its input level against its output level in dB. The red dot is the threshold, above it the ratio applies."
            eq_overview: "The PEQ curves of all inputs, all outputs and the Aux in one plot. The switches only show or hide a curve and change nothing on the device."
            inputs: "Gain, polarity, mode, mute and +48V of the eight inputs, with their meters and gain riders."
            outputs: "Gain, polarity and mute of the eight outputs, with their meters."
            eq_curve: "The response of the PEQ bands and filters of this channel. Drag a point to move a band, the wheel changes PEQ Q or the HPF/LPF filter type. Double-click a point to toggle its bypass."
            gain: "Gain, polarity, mute and, on an input, mode and +48V of this channel."
            gate: "Noise gate of this input. It closes below the threshold, attack and release set how fast it opens and closes."
            comp: "Compressor of this output, as on the Comp page. Threshold, ratio, attack and release."
            delay: "Delay of this output, as on the Delay page. The unit applies to every output."
            aux_gain: "Gain of the Aux, with its meter."
            matrix: "Sources feed outputs or Aux. A cell switches its connection, the corner button swaps rows and columns. Aux cannot feed itself."
            routing_graph: "Routing from inputs on the left to outputs on the right, with Aux between them in a separate bottom row, including direct input-to-output routes."
            display: "Configure browser appearance, channels, links, meters, plots, matrix orientation and panel expansion."
            display_appearance: "Choose the browser colour theme and editor language. The language choice reloads the editor."
            display_channels: "Choose channel visibility. Hidden channels remain active. Channel-name fields below edit device settings."
            display_links: "Configure link-group marks, placement, one control per link group, the Link matrix layout and browser names. Edit link membership in the Link dialog. The corner button of the Link matrix updates the same browser preference."
            display_meters: "Choose whether meters show gate or compressor threshold marks and whether inactive thresholds are hidden."
            display_eq: "Choose overview curves and magnitude, phase and filter labels for channel plots. These preferences change no audio processing."
            display_matrix: "Choose the matrix orientation. The corner button on the Matrix page updates the same browser preference."
            display_panels: "Check a panel to expand it or clear it to collapse it. Shared channel sections use one preference across channel pages. Settings sections are included too."
            connect: "Choose the device, over USB or the network, try the editor on the simulated device, or disconnect."
            store: "Stores the live settings and the running gain riders in a preset slot of the device."
            recall: "Loads a preset of the device, which replaces all live settings and the gain riders."
            link: "Links inputs or outputs into groups. A change to one channel of a group goes to every channel of it."
            copy: "Copies every setting of an input to an input, or of an output to an output."
            lock: "The PIN that locks the front panel of the device."
            working: "Whether the device keeps the live settings through a power cycle."
            idip: "The device ID and the network address of the device."
            tone: "A test tone of the device, sine or noise, on every routed output."
            names: "Names of the inputs, the outputs and the Aux, stored on the device."
            rider: "The gain rider keeps an input at a target level. It runs in the bridge, also without this page."
            help: "The commands the device accepts over RS232."
            about: "Version and licence of trackdsp."
            autoeq_setup: "Which outputs to correct, which mic records and which bands the fit may use."
            autoeq_measure: "Records the device's pink noise at one or more mic positions."
            autoeq_fit: "Fits PEQ bands to the measured curve against the target curve."
            autoeq_apply: "Writes the fitted bands to the outputs and measures again to verify them."
            autoeq_backups: "The PEQ bands from before every session, to revert to."

