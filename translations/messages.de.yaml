    # Tooltips. A widget looks its own up by its state path without side and index, e.g. comp.ratio
    tip:
        gain: "Pegel des Kanals in dB. 0 dB lässt das Signal unverändert, die unterste Stufe schaltet ihn stumm."
        mute: "Schaltet den Kanal stumm. Der Gain behält seinen Wert."
        phase: "Polarität. Inverse dreht das Signal um, etwa für einen verkehrt verdrahteten Lautsprecher oder ein Mikrofon."
        mode: "Eingangsempfindlichkeit. Line für Quellen mit Line-Pegel, Mic für Mikrofone. +48V braucht einen Mic-Modus."
        phantom: "+48V Phantomspeisung für Kondensatormikrofone. Sie braucht einen Mic-Modus."
        delay: "Verzögert den Ausgang, etwa um Lautsprecher in verschiedenen Abständen anzugleichen. In der oben gewählten Einheit ms, m oder ft."
        delay_unit: "Die Einheit der Delay-Felder. Das Gerät speichert das Delay in Samples, ein Wechsel ändert also kein Delay."
        gate:
            threshold: "Unter diesem Pegel schließt das Gate und macht den Eingang still, in dB auf der Skala der Pegelanzeige."
            attack: "Wie schnell das Gate öffnet, sobald der Pegel über die Schwelle steigt, in ms."
            release: "Wie schnell das Gate schließt, sobald der Pegel unter die Schwelle fällt, in ms."
        comp:
            threshold: "Über diesem Pegel senkt der Kompressor den Gain, in dB auf der Skala der Pegelanzeige."
            ratio: "Wie stark ein Pegel über der Schwelle reduziert wird. Bei 1:2.0 werden aus 2 dB über der Schwelle 1 dB. Limit hält den Pegel an der Schwelle."
            knee: "Wie weich die Kompression um die Schwelle herum einsetzt, in dB. 0 dB ist ein harter Knick."
            attack: "Wie schnell der Kompressor reagiert, sobald der Pegel über die Schwelle steigt, in ms."
            release: "Wie schnell der Kompressor wieder loslässt, sobald der Pegel unter die Schwelle fällt, in ms."
        sub:
            gain: "Pegel dieser Sub Control in Prozent. Sie bewegt jeden Kanal, den sie auswählt."
            mute: "Schaltet jeden Kanal stumm, den diese Sub Control auswählt."
            mask: "Wählt die Kanäle, die diese Sub Control bewegt."
        groups:
            gain: "Pegel dieser Gruppe in Prozent. Sie bewegt jeden Kanal, den die Gruppe auswählt."
            mute: "Schaltet jeden Kanal stumm, den diese Gruppe auswählt."
            mask: "Wählt die Kanäle, die diese Gruppe bewegt."
        select: "Wählt die Eingänge, die den Aux speisen."
        automix:
            on: "Schaltet AutoMix ein oder aus."
            threshold: "Pegel, ab dem AutoMix einen Eingang als aktiv zählt, in dB."
            attack: "Wie schnell AutoMix einen Eingang öffnet, der aktiv wird, in ms."
            release: "Wie schnell AutoMix einen Eingang absenkt, der still wird, in ms."
            select: "Wählt die Eingänge, mit denen AutoMix arbeitet."
        automix_slope: "Wie weit AutoMix die Eingänge absenkt, wenn mehr von ihnen aktiv werden, in dB."
        camera:
            on: "Schaltet die Camera-Funktion ein oder aus."
        effect:
            on: "Schaltet den Aux-Effekt ein oder aus."
            echo: "Pegel des Echos, 0 bis 100."
            echo_repeat: "Wie viel vom Echo sich wiederholt, 0 bis 100."
            echo_delay: "Zeit zwischen den Echos, in ms."
            echo_predelay: "Zeit bis zum ersten Echo, in ms."
            reverb: "Pegel des Halls, 0 bis 100."
            reflect: "Stärke der Reflexionen im Hall, 0 bis 100."
            time: "Länge des Halls, in s."
            rev_predelay: "Zeit, bis der Hall einsetzt, in ms."
            gain: "Pegel des gesamten Effekts, 0 bis 100."
        tone_mode: "Quelle des Testtons: die analogen Eingänge, rosa oder weißes Rauschen oder ein Sinus."
        tone_freq: "Frequenz des Sinus, in Hz."
        device_id: "Die ID des Geräts für die Steuerung über RS232/485, 1 bis 254."
        demo: "Verbindet mit dem simulierten Gerät, um den Editor ohne 8x8 auszuprobieren. Nichts erreicht ein Gerät."
        bar:
            online: "Zeigt, ob der Editor das Gerät erreicht. Demo bedeutet das simulierte Gerät. Ein Klick öffnet die Verbindung, um das Gerät zu wählen oder zu trennen."
        foot:
            number: "Das Preset, das das Gerät zuletzt geladen oder gespeichert hat, U01 bis U20 oder F00 für die Werkseinstellung. Bis das Gerät eines meldet, steht hier –."
            name: "Der Name der Live-Einstellungen aus dem zuletzt geladenen oder gespeicherten Preset. Speichern schlägt ihn für den Platz vor."
        eq_bypass: "Schaltet den EQ dieses Kanals ab. Die Bänder behalten ihre Werte."
        eq_reset: "Setzt jedes Band dieses Kanals auf 0 dB bei seiner Standardfrequenz zurück."
        band:
            freq: "Mittenfrequenz des Bands, in Hz."
            q: "Q ist die Breite des Bands. Ein höheres Q wirkt auf einen schmaleren Bereich."
            gain: "Anhebung oder Absenkung des Bands, in dB."
            type: "Filterform des Bands: Peak, Shelf, Tief- oder Hochpass oder Allpass."
            bypass: "Schaltet das Band ab, ohne seine Werte zu verlieren."
        hpf_freq: "Frequenz des Hochpassfilters, in Hz. Alles darunter wird abgeschnitten."
        lpf_freq: "Frequenz des Tiefpassfilters, in Hz. Alles darüber wird abgeschnitten."
        slope: "Wie steil der Filter abschneidet, in dB pro Oktave. BW ist Butterworth, BL Bessel und LK Linkwitz-Riley."
        panel:
            peq: "Parametrischer EQ (PEQ). Jedes Band hebt oder senkt den Bereich um seine Frequenz."
            selected_band: "Frequenz, Q und Gain des Bands, das in der Tabelle oder auf der Kurve gewählt ist."
            hpf: "Hochpassfilter (HPF). Er entfernt alles unterhalb seiner Frequenz."
            lpf: "Tiefpassfilter (LPF). Er entfernt alles oberhalb seiner Frequenz."
            fbq: "Feedback-Unterdrückung (FBQ). Sie findet Rückkopplungen und senkt sie schmalbandig ab. Aus schaltet sie ab, Stufe 1 bis 4 legt fest, wie stark sie eingreift."
            aux_comp: "Kompressor des Aux. Einstellen öffnet alle seine Werte."
            aux_comp_dialog: "Schwelle, Ratio, Knee, Attack und Release des Aux-Kompressors."
            automix: "AutoMix senkt die gewählten Eingänge ab, die nicht genutzt werden, sodass nur die aktiven Mikrofone offen bleiben."
            effect: "Echo und Hall auf dem Aux."
            camera: "Camera-Funktion des Hersteller-Editors, eingestellt wie AutoMix. Was das Gerät damit tut, ist noch nicht dokumentiert."
            aux_select: "Die Eingänge, die den Aux speisen."
            sub: "Sub Control. Ein Fader und ein Mute für eine Auswahl von Eingängen und einer für eine Auswahl von Ausgängen, in Prozent. Dazwischen der Aux, mit seinem Gain, seinem Mute und den Eingängen, die ihn speisen."
            groups: "Group Control. Acht Gruppen mit je einem Fader und einem Mute für die Kanäle, die sie auswählen, in Prozent."
            eq_overview: "Die PEQ-Kurven aller Eingänge, aller Ausgänge und des Aux in einem Diagramm. Die Schalter blenden eine Kurve nur ein oder aus und ändern nichts am Gerät."
            inputs: "Gain, Polarität, Modus, Mute und +48V der acht Eingänge, mit ihren Pegelanzeigen und Gain-Ridern."
            outputs: "Gain, Polarität und Mute der acht Ausgänge, mit ihren Pegelanzeigen."
            eq_curve: "Der Frequenzgang der PEQ-Bänder und Filter dieses Kanals. Einen Punkt ziehen verschiebt ein Band, das Mausrad auf einem Punkt ändert sein Q."
            gain: "Gain, Polarität, Mute und bei einem Eingang Modus und +48V dieses Kanals."
            gate: "Noise Gate dieses Eingangs. Es schließt unterhalb der Schwelle, Attack und Release legen fest, wie schnell es öffnet und schließt."
            comp: "Kompressor dieses Ausgangs, wie auf der Seite Comp. Schwelle, Ratio, Knee, Attack und Release."
            delay: "Delay dieses Ausgangs, wie auf der Seite Delay. Die Einheit gilt für alle Ausgänge."
            aux_gain: "Gain des Aux, mit seiner Pegelanzeige."
            routing_graph: "Das Routing der Matrix als Graph, von den Eingängen und dem Aux links zu den Ausgängen rechts."
            connect: "Gerät wählen, über USB oder das Netzwerk, den Editor am simulierten Gerät ausprobieren oder die Verbindung trennen."
            store: "Speichert die Live-Einstellungen und die laufenden Gain-Rider auf einem Presetplatz des Geräts."
            recall: "Lädt ein Preset des Geräts. Es ersetzt alle Live-Einstellungen und die Gain-Rider."
            link: "Verknüpft Eingänge oder Ausgänge zu Gruppen. Eine Änderung an einem Kanal einer Gruppe gilt für alle ihre Kanäle."
            copy: "Kopiert alle Einstellungen eines Eingangs auf einen Eingang oder eines Ausgangs auf einen Ausgang."
            lock: "Die PIN, die das Bedienfeld des Geräts sperrt."
            working: "Ob das Gerät die Live-Einstellungen über einen Neustart behält."
            idip: "Die Geräte-ID und die Netzwerkadresse des Geräts."
            tone: "Ein Testton des Geräts, Sinus oder Rauschen, auf jedem gerouteten Ausgang."
            names: "Namen der Eingänge, der Ausgänge und des Aux, im Gerät gespeichert."
            rider: "Der Gain-Rider hält einen Eingang auf einem Zielpegel. Er läuft in der Bridge, auch ohne diese Seite."
            help: "Die Befehle, die das Gerät über RS232 annimmt."
            about: "Version und Lizenz von trackdsp."
            autoeq_setup: "Welche Ausgänge korrigiert werden, welches Mikrofon aufnimmt und welche Bänder die Anpassung nutzen darf."
            autoeq_measure: "Nimmt das rosa Rauschen des Geräts an einer oder mehreren Mikrofonpositionen auf."
            autoeq_fit: "Passt PEQ-Bänder an die gemessene Kurve gegen die Zielkurve an."
            autoeq_apply: "Schreibt die angepassten Bänder auf die Ausgänge und misst zur Kontrolle erneut."
            autoeq_backups: "Die PEQ-Bänder von vor jeder Sitzung, zum Zurücksetzen."

# Widget labels and explanatory text use their English source as message IDs.
"1:1.1 compresses levels above the threshold slightly, below it the gain is exact.": "1:1.1 komprimiert Pegel über der Schwelle leicht, darunter ist der Gain exakt."
"\"auto\" connects to the first device found, USB before the network. Disconnect frees the device's connection, and the vendor editor may take it at once.": "„auto“ verbindet das erste gefundene Gerät. USB hat Vorrang vor dem Netzwerk. Trennen gibt die Geräteverbindung frei. Der Hersteller-Editor kann sie anschließend übernehmen."
