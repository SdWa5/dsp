            lpf: "Tiefpassfilter (LPF). Er entfernt alles oberhalb seiner Frequenz."
            fbq: "Feedback-Unterdrückung (FBQ). Sie findet Rückkopplungen und senkt sie schmalbandig ab. Aus schaltet sie ab, Stufe 1 bis 4 legt fest, wie stark sie eingreift."
