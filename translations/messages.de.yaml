": free control software for the Thomann t.racks 8x8 Matrix DSP over USB (HID) and TCP port 9761.": " steuert den Thomann t.racks 8x8 Matrix DSP über USB (HID) und TCP-Port 9761 als freie Software."
"A cell links its row and column channel, and linked channels form a group, which lights as a block. A lit cell takes the later of its two channels out of its group, in the full matrix the column channel. The lowest channel of a group is copied to the others. The rows and columns follow the placement below, and the corner button switches between the lower half, the upper half and the full matrix.": "Eine Zelle verknüpft ihren Zeilen- und Spaltenkanal. Verknüpfte Kanäle bilden eine Gruppe, die als Block leuchtet. Eine leuchtende Zelle entfernt den späteren ihrer beiden Kanäle aus seiner Gruppe, in der vollen Matrix den Spaltenkanal. Der niedrigste Kanal einer Gruppe wird auf die anderen kopiert. Zeilen und Spalten folgen der unten gewählten Anordnung, und die Eckschaltfläche wechselt zwischen unterer Hälfte, oberer Hälfte und voller Matrix."
"A recall replaces all live settings and the gain riders.": "Laden ersetzt alle aktuellen Einstellungen und die Gain-Rider."
