    # Tooltips. A widget looks its own up by its state path without side and index, e.g. comp.ratio
    tip:
        name: "Namen werden auf dem Gerät und mit Presets gespeichert. Bis zu 8 Zeichen sind möglich. Änderungen werden an das verbundene Gerät gesendet, ohne verknüpfte Mitglieder umzubenennen."
        eq_labels: "Beschriftungen für alle PEQ-Bänder sowie Hochpass und Tiefpass anzeigen. Dies ändert nur die Diagrammbeschriftungen; Filtereinstellungen und Bypass bleiben unverändert."
        display:
            theme: "Automatisch folgt dem Farbschema des Systems. Hell und Dunkel überschreiben es für diesen Browser."
            language: "Automatisch verwendet die Server-/Browsersprache. Englisch oder Deutsch speichert ein Sprach-Cookie und lädt den Editor neu."
            visibility: "Diesen Kanal in Navigation, Bearbeitungsseiten, Matrix, Routing-Diagramm und Gain-EQ-Übersicht anzeigen. Ausgeblendete Kanäle bleiben aktiv und erhalten weiterhin verknüpfte Änderungen."
            grouped: "Ein Steuerelement je verknüpfter Bearbeitungsgruppe und eine Gruppenauswahl mit gemischtem Zustand für Sichtbarkeit, Übersichtsauswahl und Kanal-EQ-Einstellungen anzeigen. Matrix, Routing und Mitgliedsauswahlen behalten einzelne Kanäle. Gruppenänderungen schließen ausgeblendete Mitglieder ein."
            show_inputs: "Alle acht Eingänge anzeigen. Die Sichtbarkeit der Ausgänge und des Aux bleibt unverändert."
            show_outputs: "Alle acht Ausgänge anzeigen. Die Sichtbarkeit der Eingänge und des Aux bleibt unverändert."
            show_all: "Alle Eingänge, Ausgänge und Aux anzeigen. Die aktuelle Einstellung für Link-Gruppen-Steuerelemente bleibt erhalten."
            link_code: "Den Code oder Browsernamen jeder Link-Gruppe anzeigen. Link-Zuweisungen bleiben unverändert."
            link_shape: "Das individuelle Symbol jeder Link-Gruppe in der Oberfläche anzeigen."
            link_colour: "Link-Gruppen-Farben an Kanalmarkierungen, Gruppenüberschriften und Browser-Gruppennamen anzeigen."
            placement_normal: "Kanäle in ihrer ursprünglichen numerischen Reihenfolge belassen."
            placement_side: "Verknüpfte Kanalmitglieder nebeneinander anordnen und ihre einzelnen Steuerelemente beibehalten."
            placement_stacked: "Verknüpfte Mitglieder unter einer gemeinsamen Überschrift mit Name, Symbol und Farbe zusammenfassen. Hohe Bearbeitungsstreifen bleiben nebeneinander."
            link_matrix_lower: "Jedes Kanalpaar im Link-Dialog einmal unterhalb der Diagonale zeigen, mit den Spaltenköpfen unter der Matrix. Eine leuchtende Zelle entfernt den späteren Kanal des Paars aus seiner Gruppe."
            link_matrix_upper: "Jedes Kanalpaar im Link-Dialog einmal oberhalb der Diagonale zeigen, mit den Zeilenköpfen rechts. Eine leuchtende Zelle entfernt den späteren Kanal des Paars aus seiner Gruppe."
            link_matrix_full: "Die volle Matrix des Link-Dialogs mit beiden Hälften zeigen. Eine leuchtende Zelle entfernt ihren Spaltenkanal aus seiner Gruppe."
            group_names: "Jeder Link-Gruppe einen nur im Browser gespeicherten Namen mit bis zu 12 Zeichen geben. Leer lassen, um den Gruppencode zu verwenden. Gerätekanalnamen und Link-Zuweisungen bleiben unverändert."
            overview_channel: "Diese Kanalkurve in der Gain-EQ-Übersicht anzeigen. Ihre Auswahl bleibt beim globalen Ausblenden erhalten und wird nach dem Einblenden wieder verwendet."
            channel_eq: "Betrags-, Phasen- und Filterbeschriftungsanzeige für jedes Kanaldiagramm unabhängig einstellen, auch für global ausgeblendete Kanäle."
            matrix: "Eingänge und Aux als Matrixzeilen sowie Ausgänge und Aux als Spalten verwenden. Abwählen, um die Ausrichtung umzukehren. Routing-Verbindungen bleiben unverändert."
        gain: "Pegel des Kanals in dB. 0 dB lässt das Signal unverändert, die unterste Stufe schaltet ihn stumm."
        mute: "Schaltet den Kanal stumm. Der Gain behält seinen Wert."
        phase: "Polarität. Inverse dreht das Signal um, etwa für einen verkehrt verdrahteten Lautsprecher oder ein Mikrofon."
        mode: "Eingangsempfindlichkeit. Line für Quellen mit Line-Pegel, Mic für Mikrofone. +48V braucht einen Mic-Modus."
        phantom: "+48V Phantomspeisung für Kondensatormikrofone. Sie braucht einen Mic-Modus."
        delay: "Verzögert den Ausgang, etwa um Lautsprecher in verschiedenen Abständen anzugleichen. In der oben gewählten Einheit ms, m oder ft."
        delay_unit: "Die Einheit der Delay-Felder. Das Gerät speichert das Delay in Samples, ein Wechsel ändert also kein Delay."
        gate:
            threshold: "Unter diesem Pegel schließt das Gate und macht den Eingang still, in dB auf der Skala der Pegelanzeige."
            attack: "Wie schnell das Gate öffnet, sobald der Pegel über die Schwelle steigt, in ms."
            release: "Wie schnell das Gate schließt, sobald der Pegel unter die Schwelle fällt, in ms."
        comp:
            threshold: "Über diesem Pegel senkt der Kompressor den Gain, in dB auf der Skala der Pegelanzeige."
            ratio: "Wie stark ein Pegel über der Schwelle reduziert wird. Bei 1:2.0 werden aus 2 dB über der Schwelle 1 dB. Limit hält den Pegel an der Schwelle."
            attack: "Wie schnell der Kompressor reagiert, sobald der Pegel über die Schwelle steigt, in ms."
            release: "Wie schnell der Kompressor wieder loslässt, sobald der Pegel unter die Schwelle fällt, in ms."
        sub:
            gain: "Pegel dieser Sub Control in Prozent. Sie bewegt jeden Kanal, den sie auswählt."
            mute: "Schaltet jeden Kanal stumm, den diese Sub Control auswählt."
            mask: "Wählt die Kanäle, die diese Sub Control bewegt."
        groups:
            gain: "Pegel dieser Gruppe in Prozent. Sie bewegt jeden Kanal, den die Gruppe auswählt."
