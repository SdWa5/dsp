            eq_curve: "Der Frequenzgang der PEQ-Bänder und Filter dieses Kanals. Einen Punkt ziehen verschiebt ein Band, das Mausrad ändert PEQ-Q oder den HPF/LPF-Filtertyp. Ein Doppelklick auf einen Punkt schaltet dessen Bypass."
            gain: "Gain, Polarität, Mute und bei einem Eingang Modus und +48V dieses Kanals."
