". These command numbers do not apply over USB or TCP.": ". Diese Befehlsnummern gelten nicht für USB oder TCP."
"0/1/2, mask hi, mask lo": "0/1/2, Maske hi, Maske lo"
"00, channel, 0–4": "00, Kanal, 0–4"
"1:1.1 with the threshold at +20 dB never compresses and keeps the gain exact.": "1:1.1 bei einer Schwelle von +20 dB komprimiert nicht und hält den Gain exakt."
": free control software for the Thomann t.racks 8x8 Matrix DSP over USB (HID) and TCP port 9761.": " steuert den Thomann t.racks 8x8 Matrix DSP über USB (HID) und TCP-Port 9761 als freie Software."
"A cell links its row and column channel, and linked channels form a group, which lights as a block. A lit cell takes the column channel out of its group. The lowest channel of a group is copied to the others. The rows and columns follow the placement below.": "Eine Zelle verknüpft ihren Zeilen- und Spaltenkanal. Verknüpfte Kanäle bilden eine Gruppe, die als Block leuchtet. Eine leuchtende Zelle entfernt den Spaltenkanal aus seiner Gruppe. Der niedrigste Kanal einer Gruppe wird auf die anderen kopiert. Zeilen und Spalten folgen der unten gewählten Anordnung."
"A recall replaces all live settings and the gain riders.": "Laden ersetzt alle aktuellen Einstellungen und die Gain-Rider."
