            display_panels: "Einen Abschnitt auswählen, um ihn aufzuklappen, oder abwählen, um ihn einzuklappen. Gemeinsame Kanalabschnitte verwenden dieselbe Einstellung auf allen Kanalseiten. Die Einstellungsabschnitte sind ebenfalls enthalten."
