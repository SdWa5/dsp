            aux_gain: "Gain des Aux, mit seiner Pegelanzeige."
            matrix: "Quellen versorgen Ausgänge oder Aux. Eine Zelle schaltet die Verbindung, der Eckknopf tauscht Zeilen und Spalten. Aux kann sich nicht selbst versorgen."
