"The rider moves the input gain slowly towards a target meter level. It runs in the bridge, so it keeps working without this page and after a restart. When somebody moves the gain, it pauses for the hold time.": "Der Rider bewegt den Eingangs-Gain langsam zu einem Zielpegel. Er läuft in der Bridge und arbeitet ohne diese Seite sowie nach einem Neustart weiter. Eine manuelle Gain-Änderung pausiert ihn für die Haltezeit."
"The tone plays on every routed output. Set the source back to Analog Input when done.": "Der Ton spielt auf jedem verbundenen Ausgang. Anschließend die Quelle auf Analogeingang zurückstellen."
