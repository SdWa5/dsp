name: CI

on:
  push:
  workflow_dispatch:

# The token gets read access and nothing else. No job writes to the repository or reads `secrets`. A fork's pull
# request runs nothing, because there is no `pull_request` trigger, as in the sibling repositories.
permissions:
  contents: read

jobs:
  ci-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test CI tool download verification
        run: python3 -B -m unittest discover -s .github/tests -v

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      - name: Coding standard
        run: composer cs
      - name: Translation and configuration syntax
        run: composer lint
      - name: Static analysis
        run: composer stan
      - name: Tests
        run: composer test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Browser code tests
        run: node --test assets/tests/*.test.js

  # Secret scanning, on the working tree and on the full history, as in sdwa5-3d. A public repository publishes
  # every past commit at once, so the gate stops the next secret rather than finding a current one. The CLI is used
  # directly, because gitleaks/gitleaks-action needs a licence key for organization-owned repositories.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified gitleaks
        run: |
          bash .github/scripts/install-ci-tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml'
