# Audio capture from the web container (arecord for the auto EQ and trackdsp:measure), also after replugging.
# The host's /dev/snd is bound as a directory, so a replugged interface shows up without a restart. ALSA's
# character devices have the fixed major number 116, and the cgroup rule allows them only. The host gives the
# nodes to the logged-in desktop user through the seat ACL of logind, and the container runs as that user. No
# privileged mode and no host PID namespace.
# PipeWire opens the card whenever a desktop stream uses it, and arecord then fails with "Device or resource
# busy". `pactl set-card-profile <card> off` hands the card to ALSA alone (`pactl list cards short` names it).
services:
  web:
    volumes:
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 116:* rmw"
