; The JIT stays off, with its buffer reserved, so that sdwa5-dsp:measure and sdwa5-dsp:autoeq can switch it on
; for their FFTs (App\Measurement\Jit). Switched on here, it would cost every PHP process about 0.4 s of
; compiling Symfony's boot code. Xdebug switches the JIT off while it is loaded.
[opcache]
opcache.enable_cli = 1
opcache.jit = off
opcache.jit_buffer_size = 64M
